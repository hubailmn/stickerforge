services:
  stickerforge:
    build: .
    container_name: stickerforge
    image: stickerforge:latest
    restart: unless-stopped
    # Bound to localhost only; nginx proxies stickerforge.bytej.cc to this port.
    ports:
      - "127.0.0.1:5070:8000"
    environment:
      STICKERFORGE_ALLOW_PRIVATE_HOSTS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
