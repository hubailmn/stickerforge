[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stickerforge"
version = "1.0.0"
description = "Build WhatsApp sticker packs (.wastickers) from GIFs and images"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "Flask>=3.0",
    "requests>=2.31",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stickerforge = "stickerforge.cli:main"

[tool.setuptools]
packages = ["stickerforge"]

[tool.setuptools.package-data]
stickerforge = ["templates/*.html", "static/*"]
